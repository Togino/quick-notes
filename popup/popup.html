<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Notes</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body data-theme="auto">
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M5 3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9l-2-2H5V5h14v8l2 2V5a2 2 0 0 0-2-2H5zm12.7 10.3-4.4 4.4a1 1 0 0 0-.3.7v2a1 1 0 0 0 1 1h2a1 1 0 0 0 .7-.3l4.4-4.4-3-3zM21 13.4 18.6 11l1.7-1.7a.5.5 0 0 1 .7 0l1.7 1.7-1.7 2.4z"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Quick Notes</h1>
          <span class="brand-sub" id="noteCount">0 note</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeToggle" title="Changer le thème" aria-label="Changer le thème">
          <svg class="ico-sun" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1zm0 17a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-2a1 1 0 0 1 1-1zM4.2 4.2a1 1 0 0 1 1.4 0l1.5 1.5a1 1 0 1 1-1.4 1.4L4.2 5.6a1 1 0 0 1 0-1.4zm12.3 12.3a1 1 0 0 1 1.4 0l1.5 1.5a1 1 0 1 1-1.4 1.4l-1.5-1.5a1 1 0 0 1 0-1.4zM2 12a1 1 0 0 1 1-1h2a1 1 0 1 1 0 2H3a1 1 0 0 1-1-1zm17 0a1 1 0 0 1 1-1h2a1 1 0 1 1 0 2h-2a1 1 0 0 1-1-1zM4.2 19.8a1 1 0 0 1 0-1.4l1.5-1.5a1 1 0 1 1 1.4 1.4l-1.5 1.5a1 1 0 0 1-1.4 0zM16.5 7.5a1 1 0 0 1 0-1.4l1.5-1.5a1 1 0 1 1 1.4 1.4l-1.5 1.5a1 1 0 0 1-1.4 0z"/></svg>
          <svg class="ico-moon" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn" id="addTagBtn" title="Créer un tag" aria-label="Créer un tag">
          <span style="font-size:15px; font-weight:700; line-height:1">#＋</span>
        </button>
        <button class="icon-btn" id="settingsBtn" title="Réglages" aria-label="Réglages">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
      </div>
    </header>

    <div id="listView" class="view">
      <div class="search-row">
        <div class="search">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M10 2a8 8 0 1 1-4.9 14.3l-3.4 3.4-1.4-1.4 3.4-3.4A8 8 0 0 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
          <input type="search" id="searchInput" placeholder="Rechercher dans les notes, #tags…" autocomplete="off">
          <kbd id="searchKbd">/</kbd>
        </div>
        <button class="btn primary" id="newNoteBtn" title="Nouvelle note (Ctrl+N)">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
          <span class="btn-text">Nouvelle</span>
        </button>
        <button class="btn" id="exportAllTopBtn" title="Exporter toutes les notes (.json)">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 3v12m0 0l4-4m-4 4l-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          Exporter
        </button>
        <button class="icon-btn" id="starFilterBtn" title="Afficher uniquement les favoris" aria-label="Favoris">★</button>
      </div>
      <div class="tags-bar" id="tagsBar"></div>
      <main class="content" id="notesList"></main>
      <div class="empty-state" id="emptyState" hidden>
        <div class="empty-illu">📝</div>
        <p>Aucune note pour le moment.</p>
        <button class="btn primary" id="emptyNewBtn">Créer ma première note</button>
      </div>
      <footer class="footer-stats" id="footerStats"></footer>
    </div>

    <div id="editorView" class="view" hidden>
      <div class="editor-sidebar-wrap">
        <header class="editor-topbar">
          <button class="icon-btn" id="backBtn" title="Retour à la liste">◀</button>
          <h1 id="editTitle">Édition</h1>
          <button class="icon-btn" id="editPinBtn" title="Épingler" aria-label="Épingler">📌</button>
          <button class="icon-btn" id="editStarBtn" title="Favori" aria-label="Favori">★</button>
          <button class="icon-btn danger" id="editDelBtn" title="Supprimer la note" aria-label="Supprimer">🗑</button>
          <button class="icon-btn" id="openInTabBtn" title="Ouvrir dans un onglet">↗</button>
        </header>
        <div class="editor-body">
          <input id="titleInput" class="title" placeholder="Titre de la note…" autocomplete="off">
          <input id="tagsInput" class="tags" placeholder="Tags #idées…" autocomplete="off">
          <div class="toolbar" id="toolbar">
            <select class="bb tool-select" id="sizeSel" title="Taille du texte" aria-label="Taille du texte">
              <option value="">↕ Taille</option>
              <option value="normal">Normal</option>
              <option value="12">12</option>
              <option value="14">14</option>
              <option value="16">16</option>
              <option value="18">18</option>
              <option value="20">20</option>
              <option value="24">24</option>
              <option value="28">28</option>
              <option value="32">32</option>
              <option value="40">40</option>
              <option value="48">48</option>
            </select>
            <span class="sep"></span>
            <button class="bb" data-cmd="bold" title="Gras (Ctrl+B)"><b>B</b></button>
            <button class="bb" data-cmd="italic" title="Italique (Ctrl+I)"><i>I</i></button>
            <button class="bb" data-cmd="underline" title="Souligné (Ctrl+U)"><u>U</u></button>
            <button class="bb" data-cmd="strikeThrough" title="Barré"><s>S</s></button>
            <span class="sep"></span>
            <button class="bb" data-cmd="insertUnorderedList" title="Liste à puces">•≡</button>
            <button class="bb" data-cmd="insertOrderedList" title="Liste numérotée">1≡</button>
            <button class="bb" data-format="blockquote" title="Citation">❝</button>
            <button class="bb" data-format="pre" title="Code">⟨/⟩</button>
            <span class="sep"></span>
            <button class="bb" data-cmd="link" title="Insérer un lien">⛓</button>
            <button class="bb" data-cmd="unlink" title="Retirer le lien">⛓̶</button>
            <button class="bb" data-cmd="hr" title="Séparateur">—</button>
            <button class="bb" data-cmd="clear" title="Effacer la mise en forme">⌫</button>
            <span class="sep"></span>
            <select class="bb tool-select" id="colorSel" title="Couleur du texte" aria-label="Couleur du texte">
              <option value="">A · Couleur</option>
              <option value="#ef4444">Rouge</option>
              <option value="#f59e0b">Orange</option>
              <option value="#f5b914">Jaune</option>
              <option value="#10b981">Vert</option>
              <option value="#0ea5e9">Bleu</option>
              <option value="#6366f1">Indigo</option>
              <option value="#d946ef">Violet</option>
              <option value="#ec4899">Rose</option>
              <option value="#8a8f9e">Gris</option>
              <option value="#1a1c23">Noir</option>
              <option value="#ffffff">Blanc</option>
            </select>
            <select class="bb tool-select" id="fontSel" title="Police du texte" aria-label="Police du texte">
              <option value="">Aa · Police</option>
              <option value="Georgia, 'Times New Roman', serif">Georgia</option>
              <option value="'Palatino Linotype', Palatino, serif">Palatino</option>
              <option value="Garamond, Georgia, serif">Garamond</option>
              <option value="'Trebuchet MS', 'Segoe UI', sans-serif">Trebuchet</option>
              <option value="Verdana, Geneva, sans-serif">Verdana</option>
              <option value="Tahoma, Arial, sans-serif">Tahoma</option>
              <option value="Arial, Helvetica, sans-serif">Arial</option>
              <option value="'Courier New', Courier, monospace">Courier</option>
              <option value="'Comic Sans MS', cursive">Comic</option>
            </select>
            <select class="bb tool-select" id="hlSel" title="Surligner" aria-label="Surligner">
              <option value="">▣ Surligneur</option>
              <option value="#fde68a">Jaune</option>
              <option value="#bbf7d0">Vert</option>
              <option value="#bfdbfe">Bleu</option>
              <option value="#fbcfe8">Rose</option>
              <option value="#fed7aa">Orange</option>
            </select>
          </div>
          <div id="editor" class="editable" contenteditable="true" spellcheck="true" data-empty="Écrivez votre note…"></div>
          <footer class="statusbar">
            <span id="wordCount">0 mot</span>
            <span id="saveStatus" class="brand-sub">Prêt</span>
          </footer>
        </div>
      </div>
    </div>

    <div class="modal" id="settingsModal" hidden>
      <div class="modal-card">
        <div class="modal-head">
          <h2>Réglages</h2>
          <button class="icon-btn" id="closeSettings" aria-label="Fermer">✕</button>
        </div>
        <div class="modal-body">
          <div class="setting">
            <label for="themeSelect">Thème</label>
            <select id="themeSelect">
              <option value="auto">Suivre le système</option>
              <option value="light">Clair</option>
              <option value="dark">Sombre</option>
            </select>
          </div>
          <div class="setting">
            <label for="accentSelect">Couleur d'accent</label>
            <div class="accent-row" id="accentRow"></div>
          </div>
          <div class="setting">
            <label for="autosaveInput">Sauvegarde auto (ms)</label>
            <input type="number" id="autosaveInput" min="200" max="10000" step="100">
          </div>
          <div class="setting">
            <label for="fontSelect">Police</label>
            <select id="fontSelect">
              <option value="system">Système</option>
              <option value="serif">Serif</option>
              <option value="georgia">Georgia</option>
              <option value="trebuchet">Trebuchet</option>
              <option value="mono">Mono</option>
            </select>
          </div>
          <div class="setting">
            <label>Données</label>
            <div class="btn-row">
              <button class="btn" id="exportAllBtn">Exporter (.json)</button>
              <button class="btn" id="importAllBtn">Importer</button>
              <button class="btn danger" id="wipeBtn">Tout effacer</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal" id="confirmModal" hidden>
      <div class="modal-card confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMessage">
        <div class="confirm-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></div>
        <h2 id="confirmTitle">Supprimer ?</h2>
        <p id="confirmMessage"></p>
        <div class="confirm-actions">
          <button class="btn" id="confirmCancel">Annuler</button>
          <button class="btn danger solid" id="confirmOk">Supprimer</button>
        </div>
      </div>
    </div>
    <div class="toast" id="toast" hidden></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
